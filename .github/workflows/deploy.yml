name: Deploy to production

# Pushing to main deploys. The manual trigger is there for redeploys and rollbacks.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys write to the server at the same time.
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Build the stylesheet
        # Rebuilt here rather than trusting the committed copy, so a template
        # change can never ship with stale CSS.
        run: npm run css

      - name: Fail if the build produced nothing
        run: test -s assets/css/tailwind.css

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -path ./node_modules -prune -o -name '*.php' -print \
            | xargs -n1 php -l > /dev/null

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: kachifoodandlogistics.com
          username: github-deploy@kachifoodandlogistics.com
          password: ${{ secrets.FTP_DEPLOY }}
          protocol: ftps
          port: 21
          server-dir: /
          security: strict
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tools/**
            **/docs/**
            README.md
            BUILD.md
            package.json
            package-lock.json
            assets/css/tailwind.src.css
            config/config.local.php
            assets/uploads/**
            install.php

      - name: Verify the site responds
        run: |
          url="${{ secrets.HEALTHCHECK_URL || 'https://kachifoodandlogistics.com/' }}"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Site did not return 200 after the deploy."
          exit 1
